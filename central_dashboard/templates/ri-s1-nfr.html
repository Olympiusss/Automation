<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SentinelOne — Reporting Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b2e;--card2:#1a1f35;--border:rgba(255,255,255,0.08);--purple:#7c3aed;--purple2:#6d28d9;--purple3:#8b5cf6;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;--font:'DM Sans','Inter',sans-serif;--red:#ef4444;--orange:#f97316;--green:#22c55e;--yellow:#eab308;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.app-wrap{max-width:1400px;margin:0 auto;padding:36px 32px 72px}

/* ── Gate screens ── */
.gate{display:flex;align-items:center;justify-content:center;min-height:60vh}
.gate-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;max-width:440px;width:100%;text-align:center}
.gate-icon{font-size:44px;margin-bottom:16px}
.gate-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gate-sub{font-size:0.85rem;color:var(--muted);margin-bottom:24px;line-height:1.6}
.gate input{width:100%;padding:12px 16px;background:#0f172a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:1rem;letter-spacing:6px;text-align:center;margin-bottom:14px;transition:border-color 0.2s}
.gate input:focus{outline:none;border-color:var(--purple3)}
.gate-err{color:#f87171;font-size:0.82rem;margin-bottom:12px;min-height:18px}

/* ── Buttons ── */
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;background:linear-gradient(135deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:var(--font);font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 14px rgba(124,58,237,0.4);width:100%;justify-content:center}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.6)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.btn-export{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:linear-gradient(135deg,var(--purple2),var(--purple));border:none;border-radius:9px;color:#fff;font-family:var(--font);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 2px 8px rgba(124,58,237,0.3)}
.btn-export:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,0.5)}

/* ── App header ── */
.app-header{display:flex;align-items:flex-start;gap:20px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.header-icon{width:52px;height:52px;border-radius:14px;background:#111827;border:1.5px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
.app-header h1{font-size:1.75rem;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
.app-header p{font-size:0.875rem;color:var(--muted);margin-top:5px;line-height:1.6;max-width:700px}

/* ── Controls ── */
.controls-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px}
.ctrl-group{display:flex;flex-direction:column;gap:7px;min-width:160px}
label{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px}
input[type=date],select{padding:11px 16px;background:#0d1117;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:0.92rem;transition:border-color 0.2s;min-width:160px}
input[type=date]:focus,select:focus{outline:none;border-color:var(--purple3);box-shadow:0 0 0 3px rgba(139,92,246,0.12)}
select option{background:#1e293b;color:var(--text)}

/* ── Metric cards ── */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px;margin-bottom:28px}
.metric-card{background:var(--card);border:1px solid rgba(139,92,246,0.2);border-radius:var(--radius);padding:24px 20px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple2),var(--purple3))}
.metric-val{font-size:2.25rem;font-weight:800;line-height:1;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.metric-lbl{font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-top:8px}

/* ── Tabs ── */
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:9px;cursor:pointer;font-size:0.875rem;font-weight:600;color:var(--muted);transition:all 0.2s;border:none;background:transparent;font-family:var(--font);display:inline-flex;align-items:center;gap:7px}
.tab.active{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff;box-shadow:0 3px 10px rgba(109,40,217,0.4)}

/* ── Table ── */
.section{margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.section-title{font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px}
.data-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;min-width:400px}
thead th{background:rgba(255,255,255,0.04);padding:10px 14px;font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.04)}
tbody td{padding:9px 14px;font-size:0.85rem;color:var(--text)}

/* ── Chart containers ── */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.chart-title{font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px}
.chart-wrap{height:220px;position:relative}

/* ── Badges ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700}
.badge-critical{background:rgba(239,68,68,0.18);color:#f87171}
.badge-high{background:rgba(249,115,22,0.18);color:#fb923c}
.badge-medium{background:rgba(234,179,8,0.18);color:#facc15}
.badge-low{background:rgba(34,197,94,0.18);color:#4ade80}
.badge-unknown{background:rgba(148,163,184,0.12);color:#94a3b8}

/* ── Loader / state ── */
.loader-wrap{display:none;align-items:center;gap:10px}
.loader-wrap.active{display:flex}
.spinner{width:20px;height:20px;border:2px solid rgba(124,58,237,0.2);border-top-color:var(--purple3);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.results{animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.site-pin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.pin-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

.toast{position:fixed;bottom:28px;right:28px;background:#1e293b;border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:0.88rem;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:999;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app-wrap">

  <!-- ── SentinelOne NFR Branded Header ── -->
  <div id="mainApp">
    <div class="app-header">
      <!-- SentinelOne S1 Shield Logo -->
      <div class="header-icon" style="background:#111827;border:1.5px solid rgba(255,255,255,0.12);box-shadow:0 0 0 1px rgba(255,255,255,0.04);">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 3L5 9v11c0 9.4 6.4 18.2 15 20.9C29.6 38.2 36 29.4 36 20V9L20 3z" fill="white" opacity="0.92"/>
          <path d="M15 16.5c0-2.8 2.2-5 5-5s5 2.2 5 5c0 1.9-1.1 3.6-2.7 4.4l1.2 5.1H16.5l1.2-5.1C16.1 20.1 15 18.4 15 16.5z" fill="#111827"/>
        </svg>
      </div>
      <div>
        <h1>SentinelOne — Reporting Visualization</h1>
        <p>Enter a date range and click <strong style="color:#8b5cf6;">Fetch</strong>. Our solution will query <strong style="color:#8b5cf6;">security data</strong> from SentinelOne, visualize and summarize them, letting you download a full Excel report.</p>
      </div>
    </div>

    <!-- Date controls + site loader -->
    <div class="controls-row">
      <div class="ctrl-group"><label>Start Date</label><input type="date" id="startDate"></div>
      <div class="ctrl-group"><label>End Date</label><input type="date" id="endDate"></div>
      <button class="btn-secondary" onclick="loadSites()" id="btnLoadSites">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 8 16 12 12 16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Load Sites
      </button>
    </div>

    <div id="sitePinSection" class="site-pin-card hidden">
      <label style="margin-bottom:10px;display:block">Select Site</label>
      <div class="pin-row">
        <select id="siteSelect" onchange="onSiteChange()" style="flex:1">
          <option value="">— Choose a site —</option>
        </select>
        <button class="btn-primary" style="width:auto;padding:10px 20px;" onclick="fetchData()" id="btnFetch" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Fetch Data
        </button>
        <div class="loader-wrap" id="fetchLoader"><div class="spinner"></div><span style="color:var(--muted);font-size:0.85rem;">Fetching from SentinelOne...</span></div>
      </div>
    </div>

    <!-- Results -->
    <div id="results" class="results hidden">
      <!-- Metric cards -->
      <div class="metric-grid" id="metricCards"></div>

      <!-- Export button -->
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button class="btn-export" onclick="exportData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Export to Excel
        </button>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('threats',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          Threats
        </button>
        <button class="tab" onclick="switchTab('vulns',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Vulnerabilities
        </button>
        <button class="tab" onclick="switchTab('endpoints',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Endpoints
        </button>
        <button class="tab" onclick="switchTab('hashes',this)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
          Hashes
        </button>
      </div>

      <div id="tabThreats"></div>
      <div id="tabVulns" class="hidden"></div>
      <div id="tabEndpoints" class="hidden"></div>
      <div id="tabHashes" class="hidden"></div>
    </div>
  </div>
</div>

<script>
(function(){
  let sitesData=[], selectedSite=null, resultCache=null, chartInstances=[];

  // ── Init dates on page load ────────────────────────────────────────────────
  (function initDates(){
    const now=new Date();
    const prior=new Date(now);prior.setDate(now.getDate()-7);
    document.getElementById('startDate').value=prior.toISOString().split('T')[0];
    document.getElementById('endDate').value=now.toISOString().split('T')[0];
  })();

  // ── Sites ─────────────────────────────────────────────────────────────────
  window.loadSites=async function(){
    document.getElementById('btnLoadSites').disabled=true;
    try{
      const resp=await fetch('/api/sentinel-nfr/sites');
      const data=await resp.json();
      if(data.error){showToast('Sites error: '+data.error,'red');return}
      sitesData=data.sites||[];
      const sel=document.getElementById('siteSelect');
      sel.innerHTML='<option value="">— Choose a site —</option>';
      sitesData.forEach(s=>sel.innerHTML+=`<option value="${s.id}">${s.name}</option>`);
      document.getElementById('sitePinSection').classList.remove('hidden');
      showToast(`${sitesData.length} site(s) loaded`,'green');
    }catch(e){showToast('Error loading sites: '+e.message,'red')}
    finally{document.getElementById('btnLoadSites').disabled=false}
  };

  window.onSiteChange=function(){
    const sel=document.getElementById('siteSelect');
    selectedSite=sitesData.find(s=>String(s.id)===String(sel.value))||null;
    document.getElementById('btnFetch').disabled=!selectedSite;
  };

  // ── Fetch ─────────────────────────────────────────────────────────────────
  window.fetchData=async function(){
    if(!selectedSite){showToast('Please select a site.','red');return}

    const start_iso=document.getElementById('startDate').value+'T00:00:00.000Z';
    const end_iso=document.getElementById('endDate').value+'T23:59:59.999Z';

    setFetchLoading(true);
    document.getElementById('results').classList.add('hidden');
    destroyCharts();

    try{
      const resp=await fetch('/api/sentinel-nfr/fetch',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({site_id:selectedSite.id,site_name:selectedSite.name,start_iso,end_iso})
      });
      const data=await resp.json();
      if(data.error){showToast('Error: '+data.error,'red');return}
      resultCache={data,site_id:selectedSite.id,site_name:selectedSite.name,start_iso,end_iso};
      renderResults(data);
      document.getElementById('results').classList.remove('hidden');
    }catch(e){showToast('Network error: '+e.message,'red')}
    finally{setFetchLoading(false)}
  };

  // ── Render ────────────────────────────────────────────────────────────────
  function renderResults(d){
    const rc=d.raw_counts||{};
    document.getElementById('metricCards').innerHTML=`
      <div class="metric-card"><div class="metric-val">${(rc.total_threats||0).toLocaleString()}</div><div class="metric-lbl">Total Threats</div></div>
      <div class="metric-card"><div class="metric-val">${(rc.total_vulnerabilities||0).toLocaleString()}</div><div class="metric-lbl">Vulnerabilities</div></div>
      <div class="metric-card"><div class="metric-val">${(rc.total_endpoints||0).toLocaleString()}</div><div class="metric-lbl">Endpoints</div></div>
      <div class="metric-card"><div class="metric-val">${(rc.total_hashes||0).toLocaleString()}</div><div class="metric-lbl">Blocklisted Hashes</div></div>
      <div class="metric-card"><div class="metric-val">${(rc.unique_vuln_endpoints||0).toLocaleString()}</div><div class="metric-lbl">Vuln Endpoints</div></div>
    `;
    renderThreats(d); renderVulns(d); renderEndpoints(d); renderHashes(d);
  }

  function renderThreats(d){
    const tc=d.df_threat_class||[], tm=d.df_threat_mit||[], tf=d.df_threat_files||[], gt=d.df_grouped_threats||[];
    let h='<div class="chart-grid">';
    h+=`<div class="chart-card"><div class="chart-title">Threat Classification</div><div class="chart-wrap"><canvas id="chartThreatClass"></canvas></div></div>`;
    h+=`<div class="chart-card"><div class="chart-title">Mitigation Status</div><div class="chart-wrap"><canvas id="chartThreatMit"></canvas></div></div>`;
    h+='</div>';
    h+=buildSection('Detailed Threats',gt,['ENDPOINT','COUNT','REPORTED TIME','THREAT FILE','THREAT CLASSIFICATION','MITIGATION STATUS','ANALYST VERDICT']);
    h+=buildSection('Threat Classification Counts',tc,['Threat Classification','Count']);
    h+=buildSection('Threat Files',tf,['Threat File','Count']);
    document.getElementById('tabThreats').innerHTML=h;
    setTimeout(()=>{
      buildPieChart('chartThreatClass',tc,'Threat Classification','Count','Threat Classification');
      buildPieChart('chartThreatMit',tm,'Mitigation Status','Count','Mitigation Status');
    },50);
  }

  function renderVulns(d){
    const vs=d.df_vuln_sev||[], va=d.df_vuln_apps||[], vd=d.df_vuln_details||[];
    let h='<div class="chart-grid">';
    h+=`<div class="chart-card"><div class="chart-title">Vulnerability Severity Breakdown</div><div class="chart-wrap"><canvas id="chartVulnSev"></canvas></div></div>`;
    h+=`<div class="chart-card"><div class="chart-title">Top Vulnerable Applications</div><div class="chart-wrap"><canvas id="chartVulnApps"></canvas></div></div>`;
    h+='</div>';
    h+=buildSection('Severity Summary',vs,['Severity','Count'],true);
    h+=buildSection('Vulnerable Application Versions',va,['Application + Version','Count']);
    h+=buildSection('Vulnerability Details',vd,['Application','Version','Endpoint Name','Severity']);
    document.getElementById('tabVulns').innerHTML=h;
    setTimeout(()=>{
      buildPieChart('chartVulnSev',vs,'Severity','Count','Severity',true);
      buildBarChart('chartVulnApps',(va||[]).slice(0,10),'Application + Version','Count');
    },50);
  }

  function renderEndpoints(d){
    const epl=d.df_endpoints_list||[], os=d.df_os_table||[], av=d.df_agent_versions||[], aa=d.df_agent_attention||[];
    let h='<div class="chart-grid">';
    h+=`<div class="chart-card"><div class="chart-title">OS Distribution</div><div class="chart-wrap"><canvas id="chartOS"></canvas></div></div>`;
    h+=`<div class="chart-card"><div class="chart-title">Agent Version Distribution</div><div class="chart-wrap"><canvas id="chartAgentVer"></canvas></div></div>`;
    h+='</div>';
    h+=buildSection('OS Distribution',os,['OS Type','Count']);
    h+=buildSection('Agent Versions',av,['Agent Version','Count']);
    h+=buildSection('Attention Needed',aa,['Category','Count']);
    h+=buildSection('All Endpoints',epl,['Endpoint Name']);
    document.getElementById('tabEndpoints').innerHTML=h;
    setTimeout(()=>{
      buildPieChart('chartOS',os,'OS Type','Count','OS');
      buildBarChart('chartAgentVer',(av||[]).slice(0,10),'Agent Version','Count');
    },50);
  }

  function renderHashes(d){
    const dh=d.df_hashes||[], ds=d.df_hash_summary||[];
    let h=buildSection('Hash Blocklist Summary',ds,['OS Type','Count']);
    h+=buildSection('Blocklisted Hash Values',dh,['Hash Value','OS Type']);
    document.getElementById('tabHashes').innerHTML=h;
  }

  function buildSection(title,rows,cols,sev=false){
    if(!rows||!rows.length) return `<div class="section"><div class="section-header"><div class="section-title">${title}</div></div><p style="color:var(--muted);padding:12px;font-size:0.84rem;">No data.</p></div>`;
    let h=`<div class="section"><div class="section-header"><div class="section-title">${title} <span style="color:var(--purple3);font-weight:800;margin-left:4px;">(${rows.length})</span></div></div>`;
    h+=`<div class="data-table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    for(const r of rows){
      h+='<tr>';
      for(const c of cols){
        const v=r[c]??'';
        if(c==='Severity'||c==='THREAT CLASSIFICATION'){
          const cls={'Critical':'badge-critical','High':'badge-high','Medium':'badge-medium','Low':'badge-low'}[v]||'badge-unknown';
          h+=`<td><span class="badge ${cls}">${v}</span></td>`;
        } else if(c==='Count'||c==='COUNT'){
          h+=`<td style="font-weight:700;color:var(--purple3);">${Number(v||0).toLocaleString()}</td>`;
        } else {
          h+=`<td>${String(v).length>80?String(v).substring(0,80)+'…':v}</td>`;
        }
      }
      h+='</tr>';
    }
    return h+'</tbody></table></div></div>';
  }

  // ── Charts ────────────────────────────────────────────────────────────────
  const PURPLES=['#7c3aed','#6d28d9','#8b5cf6','#a78bfa','#4c1d95','#9333ea','#c084fc','#ddd6fe'];
  const SEV_COLORS={'Critical':'#ef4444','High':'#f97316','Medium':'#eab308','Low':'#22c55e','Informational':'#3b82f6','Unknown':'#64748b'};

  function buildPieChart(id,rows,labelKey,valKey,title,useSevColors=false){
    const el=document.getElementById(id); if(!el)return;
    const filtered=(rows||[]).filter(r=>r[labelKey]&&r[valKey]);
    if(!filtered.length)return;
    const labels=filtered.map(r=>r[labelKey]);
    const values=filtered.map(r=>Number(r[valKey]||0));
    const colors=useSevColors?labels.map(l=>SEV_COLORS[l]||'#64748b'):PURPLES;
    const inst=new Chart(el,{
      type:'doughnut',
      data:{labels,datasets:[{data:values,backgroundColor:colors,borderColor:'transparent',borderWidth:2,hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'right',labels:{color:'#94a3b8',font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${Number(ctx.raw).toLocaleString()}`}}}}
    });
    chartInstances.push(inst);
  }

  function buildBarChart(id,rows,labelKey,valKey){
    const el=document.getElementById(id); if(!el)return;
    if(!rows||!rows.length)return;
    const labels=rows.map(r=>String(r[labelKey]||'').substring(0,20));
    const values=rows.map(r=>Number(r[valKey]||0));
    const inst=new Chart(el,{
      type:'bar',
      data:{labels,datasets:[{data:values,backgroundColor:PURPLES[0],borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}}}}
    });
    chartInstances.push(inst);
  }

  function destroyCharts(){chartInstances.forEach(c=>{try{c.destroy()}catch{}});chartInstances=[];}

  // ── Export ────────────────────────────────────────────────────────────────
  window.exportData=async function(){
    if(!resultCache){showToast('Fetch data first.');return}
    showToast('Generating Excel report...');
    try{
      const resp=await fetch('/api/sentinel-nfr/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(resultCache)});
      if(!resp.ok){showToast('Export failed','red');return}
      const blob=await resp.blob();
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download=`s1_nfr_${resultCache.site_name||'report'}.xlsx`;a.click();
      showToast('Report downloaded!','green');
    }catch(e){showToast('Export error: '+e.message,'red')}
  };

  // ── Tabs ──────────────────────────────────────────────────────────────────
  window.switchTab=function(tab,el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
    ['Threats','Vulns','Endpoints','Hashes'].forEach(t=>{
      document.getElementById('tab'+t).classList.toggle('hidden',t.toLowerCase()!==tab);
    });
  };

  function setFetchLoading(on){
    document.getElementById('fetchLoader').classList.toggle('active',on);
    document.getElementById('btnFetch').disabled=on;
  }

  let toastTimer;
  function showToast(msg,type=''){
    const t=document.createElement('div');t.className='toast';
    t.style.borderColor=type==='red'?'rgba(239,68,68,0.3)':type==='green'?'rgba(34,197,94,0.3)':'var(--border)';
    t.textContent=msg;document.body.appendChild(t);
    clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3500);
  }
})();
</script>
</body>
</html>
