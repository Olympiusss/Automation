<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SentinelOne — Reporting Visualization</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b2e;--border:rgba(255,255,255,0.08);--purple:#7c3aed;--purple2:#6d28d9;--purple3:#8b5cf6;--text:#f1f5f9;--muted:#94a3b8;--radius:14px;--font:'DM Sans','Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
.app-wrap{max-width:1400px;margin:0 auto;padding:36px 32px 72px}
.gate{display:flex;align-items:center;justify-content:center;min-height:60vh}
.gate-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 40px;max-width:440px;width:100%;text-align:center}
.gate-icon{font-size:44px;margin-bottom:16px}.gate-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.gate-sub{font-size:0.85rem;color:var(--muted);margin-bottom:24px;line-height:1.6}
.gate input{width:100%;padding:12px 16px;background:#0f172a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:1rem;letter-spacing:6px;text-align:center;margin-bottom:14px;transition:border-color 0.2s}
.gate input:focus{outline:none;border-color:var(--purple3)}.gate-err{color:#f87171;font-size:0.82rem;margin-bottom:12px;min-height:18px}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;background:linear-gradient(135deg,var(--purple2),var(--purple));border:none;border-radius:10px;color:#fff;font-family:var(--font);font-size:0.95rem;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 14px rgba(124,58,237,0.4);width:100%;justify-content:center}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(124,58,237,0.6)}.btn-primary:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:0.88rem;font-weight:600;cursor:pointer;transition:all 0.2s}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.btn-export{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;background:linear-gradient(135deg,var(--purple2),var(--purple));border:none;border-radius:9px;color:#fff;font-family:var(--font);font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s}
.btn-export:hover{transform:translateY(-1px)}
.app-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.header-icon{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--purple2),var(--purple));display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 16px rgba(124,58,237,0.4)}
.app-header h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.app-header p{font-size:0.83rem;color:var(--muted);margin-top:2px}
.controls-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.ctrl-group{display:flex;flex-direction:column;gap:6px}label{font-size:0.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px}
input[type=date],select{padding:10px 14px;background:#0f172a;border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);font-size:0.9rem;transition:border-color 0.2s;min-width:160px}
input[type=date]:focus,select:focus{outline:none;border-color:var(--purple3)}select option{background:#1e293b;color:var(--text)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple2),var(--purple3))}
.metric-val{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#a78bfa,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.metric-lbl{font-size:0.76rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:6px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.04);border-radius:12px;padding:4px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:9px 18px;border-radius:9px;cursor:pointer;font-size:0.85rem;font-weight:600;color:var(--muted);border:none;background:transparent;font-family:var(--font);transition:all 0.2s}
.tab.active{background:linear-gradient(135deg,var(--purple2),var(--purple));color:#fff}
.section{margin-bottom:24px}.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.section-title{font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px}
.data-table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:420px}
table{width:100%;border-collapse:collapse;min-width:400px}
thead th{background:rgba(255,255,255,0.04);padding:10px 14px;font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1}
tbody tr{border-bottom:1px solid rgba(255,255,255,0.04);transition:background 0.15s}tbody tr:last-child{border-bottom:none}tbody tr:hover{background:rgba(255,255,255,0.04)}
tbody td{padding:9px 14px;font-size:0.85rem;color:var(--text)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}.chart-title{font-size:0.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:14px}.chart-wrap{height:220px;position:relative}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.72rem;font-weight:700}
.badge-critical{background:rgba(239,68,68,0.18);color:#f87171}.badge-high{background:rgba(249,115,22,0.18);color:#fb923c}.badge-medium{background:rgba(234,179,8,0.18);color:#facc15}.badge-low{background:rgba(34,197,94,0.18);color:#4ade80}.badge-unknown{background:rgba(148,163,184,0.12);color:#94a3b8}
.loader-wrap{display:none;align-items:center;gap:10px}.loader-wrap.active{display:flex}
.spinner{width:20px;height:20px;border:2px solid rgba(124,58,237,0.2);border-top-color:var(--purple3);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
.results{animation:fadeIn 0.4s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.site-pin-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.pin-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:28px;right:28px;background:#1e293b;border:1px solid var(--border);border-radius:12px;padding:14px 20px;font-size:0.88rem;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,0.4);z-index:999;animation:slideUp 0.3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="app-wrap">
  <!-- TOTP Gate removed — Sentrium Central is the auth layer -->

  <div id="mainApp">
    <div class="app-header">
      <!-- SentinelOne S1 Shield Logo -->
      <div class="header-icon" style="background:#111827;border:1.5px solid rgba(255,255,255,0.12);box-shadow:0 0 0 1px rgba(255,255,255,0.04);">
        <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 3L5 9v11c0 9.4 6.4 18.2 15 20.9C29.6 38.2 36 29.4 36 20V9L20 3z" fill="white" opacity="0.92"/>
          <path d="M15 16.5c0-2.8 2.2-5 5-5s5 2.2 5 5c0 1.9-1.1 3.6-2.7 4.4l1.2 5.1H16.5l1.2-5.1C16.1 20.1 15 18.4 15 16.5z" fill="#111827"/>
        </svg>
      </div>
      <div>
        <h1>SentinelOne — Reporting Visualization</h1>
        <p>Enter a date range and click <strong style="color:#8b5cf6;">Fetch</strong>. Our solution will query <strong style="color:#8b5cf6;">security data</strong> from SentinelOne, visualize and summarize them, letting you download a full Excel report.</p>
      </div>
    </div>
    <div class="controls-row">
      <div class="ctrl-group"><label>Start Date</label><input type="date" id="startDate"></div>
      <div class="ctrl-group"><label>End Date</label><input type="date" id="endDate"></div>
      <button class="btn-secondary" onclick="loadSites()" id="btnLoadSites">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 8 16 12 12 16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Load Sites
      </button>
    </div>
    <div id="sitePinSection" class="site-pin-card hidden">
      <label style="margin-bottom:10px;display:block">Select Site</label>
      <div class="pin-row">
        <select id="siteSelect" onchange="onSiteChange()" style="flex:1"><option value="">— Choose a site —</option></select>
        <input type="text" id="pinInput" placeholder="(optional)" maxlength="20" style="width:160px" onkeydown="if(event.key==='Enter')fetchData()">
        <button class="btn-primary" style="width:auto;padding:10px 20px;" onclick="fetchData()" id="btnFetch" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          Fetch Data
        </button>
        <div class="loader-wrap" id="fetchLoader"><div class="spinner"></div><span style="color:var(--muted);font-size:0.85rem;">Fetching from SentinelOne...</span></div>
      </div>
      <div id="pinErr" style="color:#f87171;font-size:0.8rem;margin-top:8px;min-height:18px"></div>
    </div>
    <div id="results" class="results hidden">
      <div class="metric-grid" id="metricCards"></div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <button class="btn-export" onclick="exportData()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Export to Excel
        </button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('threats',this)">⚠️ Threats</button>
        <button class="tab" onclick="switchTab('vulns',this)">🔓 Vulnerabilities</button>
        <button class="tab" onclick="switchTab('endpoints',this)">💻 Endpoints</button>
        <button class="tab" onclick="switchTab('hashes',this)">🔒 Hashes</button>
      </div>
      <div id="tabThreats"></div>
      <div id="tabVulns" class="hidden"></div>
      <div id="tabEndpoints" class="hidden"></div>
      <div id="tabHashes" class="hidden"></div>
    </div>
  </div>
</div>
<script>
(function(){
  const TOTP_SECRET='ESENTRYDASHBOARD7777SENTINEL';
  const SITE_PINS={'Default site':'Decipher211$','RoutePay':'Decipher777$','Infoprive Systems':'Decipher222$','Zone Payment Network Limited':'Decipher555$','Qore Inc Technologies':'Decipher666$','SunTrust Bank':'Decipher888$','Cybervergent':'Decipher111$','eTranzact':'Decipher333$'};
  let sitesData=[],selectedSite=null,resultCache=null,chartInstances=[];

  function base32Decode(i){const a='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';const s=i.replace(/=+$/,'').toUpperCase();let b=0,v=0;const o=[];for(const c of s){const idx=a.indexOf(c);if(idx===-1)continue;v=(v<<5)|idx;b+=5;if(b>=8){o.push((v>>>(b-8))&0xff);b-=8;}}return new Uint8Array(o);}
  async function hmacSha1(k,m){const key=await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:{name:'SHA-1'}},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',key,m));}
  async function genTotp(s,st){const kb=base32Decode(s);const step=st??Math.floor(Date.now()/1000/30);const ctr=new ArrayBuffer(8);new DataView(ctr).setUint32(4,step,false);const h=await hmacSha1(kb,new Uint8Array(ctr));const off=h[19]&0xf;const otp=((h[off]&0x7f)<<24|(h[off+1]&0xff)<<16|(h[off+2]&0xff)<<8|(h[off+3]&0xff))%1000000;return otp.toString().padStart(6,'0');}
  async function verifyTotpCode(s,c){const step=Math.floor(Date.now()/1000/30);for(const o of[-4,-3,-2,-1,0,1,2,3,4]){if(await genTotp(s,step+o)===c.trim())return true;}return false;}

  window.verifyTotp=async function(){
    const code=document.getElementById('totpInput').value.trim();
    if(code.length!==6){document.getElementById('totpErr').textContent='Enter a 6-digit code.';return;}
    if(await verifyTotpCode(TOTP_SECRET,code)){
      document.getElementById('totpGate').classList.add('hidden');document.getElementById('mainApp').classList.remove('hidden');initDates();
    }else{document.getElementById('totpErr').textContent='Invalid code.';document.getElementById('totpInput').value='';}
  };

  function initDates(){const n=new Date();const p=new Date(n);p.setDate(n.getDate()-7);document.getElementById('startDate').value=p.toISOString().split('T')[0];document.getElementById('endDate').value=n.toISOString().split('T')[0];}

  window.loadSites=async function(){
    document.getElementById('btnLoadSites').disabled=true;
    try{const r=await fetch('/api/sentinel-excl/sites');const d=await r.json();if(d.error){showToast('Error: '+d.error,'red');return;}sitesData=d.sites||[];const sel=document.getElementById('siteSelect');sel.innerHTML='<option value="">— Choose a site —</option>';sitesData.forEach(s=>sel.innerHTML+=`<option value="${s.id}">${s.name}</option>`);document.getElementById('sitePinSection').classList.remove('hidden');showToast(sitesData.length+' site(s) loaded','green');}
    catch(e){showToast('Error: '+e.message,'red');}
    finally{document.getElementById('btnLoadSites').disabled=false;}
  };

  window.onSiteChange=function(){const sel=document.getElementById('siteSelect');selectedSite=sitesData.find(s=>String(s.id)===String(sel.value))||null;document.getElementById('btnFetch').disabled=!selectedSite;document.getElementById('pinErr').textContent='';document.getElementById('pinInput').value='';};

  window.fetchData=async function(){
    if(!selectedSite)return;
    const pin=document.getElementById('pinInput').value;
    const expected=SITE_PINS[selectedSite.name]||SITE_PINS['Default site'];
    document.getElementById('pinErr').textContent='';
    document.getElementById('pinErr').textContent='';
    const start_iso=document.getElementById('startDate').value+'T00:00:00.000Z';
    const end_iso=document.getElementById('endDate').value+'T23:59:59.999Z';
    setFetchLoading(true);document.getElementById('results').classList.add('hidden');destroyCharts();
    try{
      const resp=await fetch('/api/sentinel-excl/fetch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site_id:selectedSite.id,site_name:selectedSite.name,start_iso,end_iso})});
      const data=await resp.json();if(data.error){showToast('Error: '+data.error,'red');return;}
      resultCache={data,site_id:selectedSite.id,site_name:selectedSite.name,start_iso,end_iso};renderResults(data);document.getElementById('results').classList.remove('hidden');
    }catch(e){showToast('Network error: '+e.message,'red');}
    finally{setFetchLoading(false);}
  };

  function renderResults(d){
    const rc=d.raw_counts||{};
    document.getElementById('metricCards').innerHTML=`<div class="metric-card"><div class="metric-val">${(rc.total_threats||0).toLocaleString()}</div><div class="metric-lbl">Total Threats</div></div><div class="metric-card"><div class="metric-val">${(rc.total_vulnerabilities||0).toLocaleString()}</div><div class="metric-lbl">Vulnerabilities</div></div><div class="metric-card"><div class="metric-val">${(rc.total_endpoints||0).toLocaleString()}</div><div class="metric-lbl">Endpoints</div></div><div class="metric-card"><div class="metric-val">${(rc.total_hashes||0).toLocaleString()}</div><div class="metric-lbl">Blocklisted Hashes</div></div><div class="metric-card"><div class="metric-val">${(rc.unique_vuln_endpoints||0).toLocaleString()}</div><div class="metric-lbl">Vuln Endpoints</div></div>`;
    renderThreats(d);renderVulns(d);renderEndpoints(d);renderHashes(d);
  }

  const PURPLES=['#7c3aed','#6d28d9','#8b5cf6','#a78bfa','#4c1d95','#9333ea','#c084fc','#ddd6fe'];
  const SEV_C={'Critical':'#ef4444','High':'#f97316','Medium':'#eab308','Low':'#22c55e','Informational':'#3b82f6','Unknown':'#64748b'};

  function buildSection(title,rows,cols){
    if(!rows||!rows.length)return`<div class="section"><div class="section-header"><div class="section-title">${title}</div></div><p style="color:var(--muted);padding:12px;font-size:0.84rem;">No data.</p></div>`;
    let h=`<div class="section"><div class="section-header"><div class="section-title">${title} <span style="color:var(--purple3);font-weight:800;">(${rows.length})</span></div></div><div class="data-table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>`;
    for(const r of rows){h+='<tr>';for(const c of cols){const v=r[c]??'';if(c==='Severity'||c==='THREAT CLASSIFICATION'){const cls={'Critical':'badge-critical','High':'badge-high','Medium':'badge-medium','Low':'badge-low'}[v]||'badge-unknown';h+=`<td><span class="badge ${cls}">${v}</span></td>`;}else if(c==='Count'||c==='COUNT'){h+=`<td style="font-weight:700;color:var(--purple3);">${Number(v||0).toLocaleString()}</td>`;}else{h+=`<td>${String(v).length>80?String(v).substring(0,80)+'…':v}</td>`;}}h+='</tr>';}
    return h+'</tbody></table></div></div>';
  }

  function renderThreats(d){
    let h='<div class="chart-grid"><div class="chart-card"><div class="chart-title">Threat Classification</div><div class="chart-wrap"><canvas id="chartThreatClass"></canvas></div></div><div class="chart-card"><div class="chart-title">Mitigation Status</div><div class="chart-wrap"><canvas id="chartThreatMit"></canvas></div></div></div>';
    h+=buildSection('Detailed Threats',d.df_grouped_threats||[],['ENDPOINT','COUNT','REPORTED TIME','THREAT FILE','THREAT CLASSIFICATION','MITIGATION STATUS','ANALYST VERDICT']);
    h+=buildSection('Threat Classification',d.df_threat_class||[],['Threat Classification','Count']);
    h+=buildSection('Threat Files',d.df_threat_files||[],['Threat File','Count']);
    document.getElementById('tabThreats').innerHTML=h;
    setTimeout(()=>{buildPieChart('chartThreatClass',d.df_threat_class||[],'Threat Classification','Count');buildPieChart('chartThreatMit',d.df_threat_mit||[],'Mitigation Status','Count');},50);
  }

  function renderVulns(d){
    let h='<div class="chart-grid"><div class="chart-card"><div class="chart-title">Vulnerability Severity</div><div class="chart-wrap"><canvas id="chartVulnSev"></canvas></div></div><div class="chart-card"><div class="chart-title">Top Vulnerable Apps</div><div class="chart-wrap"><canvas id="chartVulnApps"></canvas></div></div></div>';
    h+=buildSection('Severity Summary',d.df_vuln_sev||[],['Severity','Count']);
    h+=buildSection('Vulnerability Details',d.df_vuln_details||[],['Application','Version','Endpoint Name','Severity']);
    document.getElementById('tabVulns').innerHTML=h;
    setTimeout(()=>{buildPieChart('chartVulnSev',d.df_vuln_sev||[],'Severity','Count',true);buildBarChart('chartVulnApps',(d.df_vuln_apps||[]).slice(0,10),'Application + Version','Count');},50);
  }

  function renderEndpoints(d){
    let h='<div class="chart-grid"><div class="chart-card"><div class="chart-title">OS Distribution</div><div class="chart-wrap"><canvas id="chartOS"></canvas></div></div><div class="chart-card"><div class="chart-title">Agent Versions</div><div class="chart-wrap"><canvas id="chartAgentVer"></canvas></div></div></div>';
    h+=buildSection('OS Distribution',d.df_os_table||[],['OS Type','Count']);
    h+=buildSection('Agent Versions',d.df_agent_versions||[],['Agent Version','Count']);
    h+=buildSection('Endpoints',d.df_endpoints_list||[],['Endpoint Name']);
    document.getElementById('tabEndpoints').innerHTML=h;
    setTimeout(()=>{buildPieChart('chartOS',d.df_os_table||[],'OS Type','Count');buildBarChart('chartAgentVer',(d.df_agent_versions||[]).slice(0,10),'Agent Version','Count');},50);
  }

  function renderHashes(d){document.getElementById('tabHashes').innerHTML=buildSection('Blocklisted Hashes',d.df_hashes||[],['Hash Value','OS Type']);}

  function buildPieChart(id,rows,lk,vk,useSev=false){
    const el=document.getElementById(id);if(!el||!rows||!rows.length)return;
    const labels=rows.map(r=>r[lk]);const values=rows.map(r=>Number(r[vk]||0));
    const colors=useSev?labels.map(l=>SEV_C[l]||'#64748b'):PURPLES;
    chartInstances.push(new Chart(el,{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:colors,borderColor:'transparent',borderWidth:2,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:11},boxWidth:12}}}}}));
  }
  function buildBarChart(id,rows,lk,vk){
    const el=document.getElementById(id);if(!el||!rows||!rows.length)return;
    chartInstances.push(new Chart(el,{type:'bar',data:{labels:rows.map(r=>String(r[lk]||'').substring(0,20)),datasets:[{data:rows.map(r=>Number(r[vk]||0)),backgroundColor:PURPLES[0],borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#94a3b8'},grid:{color:'rgba(255,255,255,0.05)'}},y:{ticks:{color:'#94a3b8',font:{size:10}},grid:{display:false}}}}}));
  }
  function destroyCharts(){chartInstances.forEach(c=>{try{c.destroy()}catch{}});chartInstances=[];}

  window.exportData=async function(){
    if(!resultCache)return;showToast('Generating report...');
    try{const resp=await fetch('/api/sentinel-excl/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(resultCache)});if(!resp.ok){showToast('Export failed','red');return;}const blob=await resp.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`s1_excl_${resultCache.site_name||'report'}.xlsx`;a.click();showToast('Downloaded!','green');}
    catch(e){showToast('Error: '+e.message,'red');}
  };

  window.switchTab=function(tab,el){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');
    ['Threats','Vulns','Endpoints','Hashes'].forEach(t=>document.getElementById('tab'+t).classList.toggle('hidden',t.toLowerCase()!==tab));
  };

  function setFetchLoading(on){document.getElementById('fetchLoader').classList.toggle('active',on);document.getElementById('btnFetch').disabled=on;}
  let tt;function showToast(msg,type=''){const t=document.createElement('div');t.className='toast';t.style.borderColor=type==='red'?'rgba(239,68,68,0.3)':type==='green'?'rgba(34,197,94,0.3)':'var(--border)';t.textContent=msg;document.body.appendChild(t);clearTimeout(tt);tt=setTimeout(()=>t.remove(),3500);}
})();
</script>
</body>
</html>
