<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentrium Enterprise Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* ── Auth-specific elements ── */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 40px;
            background: rgba(248,250,252,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            gap: 14px;
        }
        .topbar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(37,99,235,0.08);
            border: 1px solid rgba(37,99,235,0.15);
            border-radius: 24px;
            padding: 8px 18px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #1d4ed8;
            letter-spacing: 0.2px;
        }
        .topbar-user .user-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.7);
            animation: blink 2.5s ease-in-out infinite;
        }
        @keyframes blink {
            0%,100%{opacity:1;} 50%{opacity:0.3;}
        }
        .topbar-dept {
            font-size: 0.82rem;
            background: rgba(15,23,42,0.06);
            border: 1px solid rgba(15,23,42,0.1);
            border-radius: 20px;
            padding: 6px 14px;
            color: #475569;
            font-weight: 600;
        }
        .btn-logout {
            background: none;
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 20px;
            padding: 8px 18px;
            color: #ef4444;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background: rgba(239,68,68,0.08);
            border-color: #ef4444;
        }



        /* Push content down below topbar */
        .container { padding-top: 100px; }

        /* ── Access Denied Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15,23,42,0.65);
            backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; animation: modal-in 0.3s ease both; }
        @keyframes modal-in { from{opacity:0;transform:scale(0.95);} to{opacity:1;transform:none;} }
        .modal-box {
            background: #ffffff;
            border-radius: 28px;
            padding: 52px 48px;
            max-width: 440px;
            width: 90%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0,0,0,0.2);
            border: 1px solid rgba(0,0,0,0.06);
        }
        .modal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            width: 88px; height: 88px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(37,99,235,0.1), rgba(79,70,229,0.1));
            border: 2px solid rgba(37,99,235,0.15);
            animation: lock-shake 0.7s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }
        .modal-icon svg {
            width: 44px; height: 44px;
        }
        @keyframes lock-shake {
            10%,90%{transform:translateX(-3px) rotate(-1deg);}
            20%,80%{transform:translateX(5px) rotate(1deg);}
            30%,50%,70%{transform:translateX(-5px) rotate(-1deg);}
            40%,60%{transform:translateX(5px) rotate(1deg);}
            100%{transform:none;}
        }
        .modal-box h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }
        .modal-box .modal-dept {
            display: inline-block;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #ef4444;
            margin-bottom: 14px;
        }
        .modal-box p {
            font-size: 1rem;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .modal-close {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            border: none;
            border-radius: 14px;
            padding: 14px 36px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 24px rgba(37,99,235,0.3);
        }
        .modal-close:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(37,99,235,0.45); }
    </style>
</head>
<body>

<!-- ── Persistent Auth Top Bar ── -->
<div class="topbar" id="topbar">
    <div class="topbar-user">
        <span class="user-dot"></span>
        <span id="topbar-name">Loading...</span>
    </div>
    <div class="topbar-dept" id="topbar-dept"></div>
    <button class="btn-logout" id="btn-logout">Sign Out</button>
</div>



<!-- ── Access Denied Modal ── -->
<div class="modal-overlay" id="access-modal">
    <div class="modal-box">
        <div class="modal-icon">
            <!-- Professional shield + lock SVG -->
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="shield-grad" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#1e3a8a"/>
                        <stop offset="100%" stop-color="#4f46e5"/>
                    </linearGradient>
                </defs>
                <!-- Shield body -->
                <path d="M24 4L6 11v12c0 10.5 7.7 20.3 18 23 10.3-2.7 18-12.5 18-23V11L24 4z"
                      fill="url(#shield-grad)" opacity="0.15" stroke="url(#shield-grad)" stroke-width="1.5"/>
                <path d="M24 4L6 11v12c0 10.5 7.7 20.3 18 23 10.3-2.7 18-12.5 18-23V11L24 4z"
                      fill="none" stroke="url(#shield-grad)" stroke-width="2" stroke-linejoin="round"/>
                <!-- Lock body -->
                <rect x="16" y="22" width="16" height="12" rx="3"
                      fill="url(#shield-grad)" opacity="0.9"/>
                <!-- Lock shackle -->
                <path d="M18.5 22v-3.5a5.5 5.5 0 0 1 11 0V22"
                      stroke="url(#shield-grad)" stroke-width="2" stroke-linecap="round" fill="none"/>
                <!-- Keyhole -->
                <circle cx="24" cy="27.5" r="2" fill="white" opacity="0.9"/>
                <rect x="23" y="27.5" width="2" height="3.5" rx="1" fill="white" opacity="0.9"/>
            </svg>
        </div>
        <h2>Access Denied</h2>
        <div class="modal-dept" id="modal-dept-name"></div>
        <p>You do not have permission to access this department's applications.<br>
           Please contact your administrator if you need access.</p>
        <button class="modal-close" id="modal-close-btn">Got it</button>
    </div>
</div>

<main class="container">
    <header class="header">
        <div class="logo-wrapper">
            <img src="logo_transparent.png" alt="Sentrium Logo" class="logo-img"
                 onerror="this.style.display='none';">
        </div>
        <h1 class="logo-title">Sentrium Enterprise Solution</h1>
        <p class="motto">Building a Secure Cyberspace for Businesses</p>
    </header>

    <div class="tabs-wrapper">
        <nav class="tabs-container" id="tabs-container"></nav>
    </div>

    <div class="main-content-split">
        <div class="cards-side">
            <div class="cards-stack" id="apps-grid"></div>
        </div>

        <div class="animation-side" id="animation-side">
            <canvas id="sacred-canvas" width="500" height="500"></canvas>
        </div>
    </div>
</main>

<!-- ── Embedded App Viewer Overlay ── -->
<div id="app-viewer" class="app-viewer">
    <div class="app-viewer-header">
        <div class="app-viewer-info">
            <div class="app-viewer-icon" id="app-viewer-icon"></div>
            <div>
                <h2 id="app-viewer-title">Application Secure Environment</h2>
                <span class="app-viewer-dept" id="app-viewer-dept">Department Name</span>
            </div>
        </div>
        <div class="app-viewer-controls">
            <button class="btn-viewer btn-viewer-primary" id="btn-viewer-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Dashboard
            </button>
        </div>
    </div>
    

    
    <div class="app-viewer-frame-container">
        <!-- Loader animation -->
        <div class="app-viewer-loader" id="app-viewer-loader">
            <div class="loader-spinner"></div>
            <p>Loading application...</p>
        </div>
        <!-- App loads here in a same-origin iframe — fully isolated, no script conflicts -->
        <iframe
            id="app-viewer-content"
            src=""
            style="width:100%;height:100%;border:none;display:block;"
            allow="clipboard-write; downloads"
            loading="lazy"
        ></iframe>
    </div>
</div>

<script src="credentials.js?v=8"></script>
<script src="auth.js?v=8"></script>
<script src="script.js?v=8"></script>
</body>
</html>
