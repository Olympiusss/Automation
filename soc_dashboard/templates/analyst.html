<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sentrium SOC — Clientele</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/dashboard.css?v=17">
<style>
/* ── Client card grid ── */
.client-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 0 0 40px;
}
@media(max-width: 1200px){ .client-grid{ grid-template-columns: repeat(3,1fr); } }
@media(max-width: 900px) { .client-grid{ grid-template-columns: repeat(2,1fr); } }
@media(max-width: 600px) { .client-grid{ grid-template-columns: 1fr; } }

.cc {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 18px 14px;
    cursor: pointer;
    transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s;
    position: relative;
}
.cc:hover {
    box-shadow: 0 6px 24px rgba(37,99,235,0.10), 0 2px 8px rgba(0,0,0,0.06);
    transform: translateY(-2px);
    border-color: #1D4ED8;
}
/* card top row */
.cc-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 14px;
}
.cc-name {
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
    max-width: 70%;
    word-break: break-word;
}
.cc-badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.cc-badge {
    font-size: 0.6rem; font-weight: 700;
    padding: 2px 7px; border-radius: 4px;
    letter-spacing: 0.3px; text-transform: uppercase;
}
.badge-s1 { background: rgba(109,40,217,0.1); color: #7C3AED; }
.badge-av { background: rgba(234,88,12,0.1);  color: #C2410C; }

/* metrics row */
.cc-metrics {
    display: flex;
    gap: 0;
    margin-bottom: 14px;
}
.cc-metric {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.cc-metric-val {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--text-primary);
    line-height: 1;
}
.cc-metric-lbl {
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
}

/* bottom row */
.cc-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 0.74rem;
}
.cc-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--text-muted);
}
.cc-dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0;
}
.dot-ok      { background: #16A34A; }
.dot-warn    { background: #D97706; }
.dot-critical{ background: #DC2626; }

.cc-view {
    font-size: 0.74rem;
    font-weight: 600;
    color: #1D4ED8;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
}
.cc-view:hover { text-decoration: underline; }
.cc-view svg { width: 12px; height: 12px; stroke: #1D4ED8; }

/* section header */
.section-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 20px 0 16px;
    flex-wrap: wrap;
    gap: 10px;
}
.section-bar h2 {
    font-size: 0.98rem;
    font-weight: 700;
    color: var(--text-primary);
}
.section-bar-right {
    font-size: 0.76rem;
    color: var(--text-muted);
}
/* ── Floating search popup ── */
.search-trigger {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 6px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
}
.search-trigger:hover { background: var(--bg-hover); color: var(--accent); }
.search-trigger svg { width: 19px; height: 19px; }

.search-popup {
    position: fixed;
    top: 64px; right: 24px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
    padding: 14px 16px;
    width: 280px;
    z-index: 999;
    display: none;
    animation: popIn 0.18s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn { from { opacity:0; transform: translateY(-8px) scale(0.97); } to { opacity:1; transform: translateY(0) scale(1); } }
.search-popup.open { display: block; }
.search-popup-inner {
    display: flex; align-items: center; gap: 8px;
}
.search-popup-inner svg { width: 15px; height: 15px; stroke: var(--text-muted); flex-shrink: 0; }
.search-popup input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 0.88rem; font-family: var(--font); color: var(--text-primary);
}
.search-popup input::placeholder { color: var(--text-muted); }
.search-popup-hint {
    font-size: 0.68rem; color: var(--text-muted); margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--border);
}

/* ── big page title ── */
.soc-page-title {
    font-size: 1.45rem;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.4px;
    line-height: 1;
    white-space: nowrap;
}

/* empty / loading */
.grid-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 0.84rem;
}
.grid-loading { display: flex; flex-direction: column; gap: 5px; }
.grid-loading .skeleton { border-radius: 4px; background: var(--skeleton-base); }

@media(max-width:768px){
    .main-content { margin-left: 0; }
}
</style>
</head>
<body class="clients-page">

<div class="notification-container" id="notification-container"></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="brand-logo">
  <svg class="brand-shield" viewBox="0 0 48 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3B6FE8"/>
      <stop offset="45%" stop-color="#1438C2"/>
      <stop offset="100%" stop-color="#08158A"/>
    </linearGradient>
    <linearGradient id="sg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.30)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <path d="M24 1 L45 10 L45 33 C45 46 36 54 24 55 C12 54 3 46 3 33 L3 10 Z" fill="url(#sg)"/>
  <path d="M24 3 L43 11 L43 24 C32 21 14 18 5 20 L5 11 Z" fill="url(#sg2)" opacity="0.7"/>
  <path d="M24 2 L44 11 L44 33 C44 46 35 53 24 54 C13 53 4 46 4 33 L4 11 Z" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <rect x="9"  y="17" width="6" height="24" rx="3" fill="white"/>
  <rect x="18" y="13" width="6" height="28" rx="3" fill="white"/>
  <rect x="27" y="15" width="6" height="26" rx="3" fill="white"/>
  <rect x="36" y="18" width="6" height="22" rx="3" fill="white"/>
  </svg>
  <div class="brand-text">
    <span class="brand-name">Sentrium</span><span class="brand-soc">SOC</span>
  </div>
  </div>
  <div class="sidebar-nav">
    <a href="/analyst" class="nav-item active">
      <span>Clientele</span>
    </a>
  </div>
  <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" style="margin-top:auto;">
    <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    <span class="tl" id="theme-label">Dark</span>
  </button>
</aside>

<!-- ═══ MAIN ═══ -->
<main class="main-content">
  <header class="topbar">
    <div class="topbar-left" style="display:flex;align-items:center;gap:12px;">
      <button class="hamburger" id="hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="soc-page-title">Security Operations Centre</span>
    </div>
    <div class="topbar-right" style="display:flex;align-items:center;gap:6px;">
      <button class="search-trigger" id="search-trigger" onclick="toggleSearch()" title="Search clients">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <a href="/logout" class="user-btn" title="Sign Out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </a>
    </div>
  </header>

  <!-- Floating search popup -->
  <div class="search-popup" id="search-popup">
    <div class="search-popup-inner">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="grid-search" placeholder="Search clients…" oninput="filterCards(this.value)" autocomplete="off">
    </div>
    <div class="search-popup-hint">Press <kbd>Esc</kbd> to close</div>
  </div>

  <!-- Card grid -->
  <div class="client-grid" id="client-grid">
    <!-- skeleton loading -->
    <div class="grid-empty" id="grid-skeleton">
      <div class="grid-loading">
        <div class="skeleton" style="height:120px;border-radius:12px;width:100%;"></div>
      </div>
      <p style="margin-top:12px;font-size:0.78rem;">Loading clients…</p>
    </div>
  </div>

</main>

<script>
const WS_URL = "{{ ws_url }}";
let ws = null, allClients = [];

function getTheme() { return localStorage.getItem('soc-theme') || 'light'; }
function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('soc-theme', t);
    const di = document.getElementById('theme-icon-dark');
    const li = document.getElementById('theme-icon-light');
    const lb = document.getElementById('theme-label');
    if (t === 'dark') { if(di)di.style.display=''; if(li)li.style.display='none'; if(lb)lb.textContent='Dark'; }
    else { if(di)di.style.display='none'; if(li)li.style.display=''; if(lb)lb.textContent='Light'; }
}
function toggleTheme() { setTheme(getTheme() === 'dark' ? 'light' : 'dark'); }
(function(){ setTheme(getTheme()); })();

function toggleMobileMenu() {
    document.getElementById('sidebar')?.classList.toggle('open');
    document.getElementById('sidebar-overlay')?.classList.toggle('visible');
    document.getElementById('hamburger')?.classList.toggle('active');
}
document.getElementById('sidebar-overlay')?.addEventListener('click', toggleMobileMenu);

function fmtNum(n) {
    if (n == null || n === undefined) return '0';
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
    return String(n);
}

function renderCards(clients) {
    const grid = document.getElementById('client-grid');
    const skel = document.getElementById('grid-skeleton');
    if (skel) skel.remove();

    if (!clients.length) {
        grid.innerHTML = '<div class="grid-empty"><p>No clients available yet.<br>Data loads after the first fetch cycle.</p></div>';
        return;
    }

    grid.innerHTML = clients.map(c => {
        const hasS1 = (c.platforms || []).includes('SentinelOne');
        const hasAV = (c.platforms || []).includes('AlienVault');

        // ENDPOINTS & THREATS → EDR (SentinelOne) only
        const eps = hasS1 ? fmtNum(c.total_endpoints ?? c.endpoints ?? 0) : '\u2014';
        const thr = hasS1 ? fmtNum(c.total_threats  ?? c.threats   ?? 0) : '\u2014';
        // ALERTS → AlienVault only
        const alr = hasAV ? fmtNum(c.total_alarms ?? c.alarms ?? c.alerts ?? 0) : '\u2014';

        const rawThr = hasS1 ? (c.total_threats ?? 0) : 0;
        let dotClass = 'dot-ok', statusText = 'Healthy';
        if (rawThr > 10) { dotClass = 'dot-critical'; statusText = rawThr + ' threats'; }
        else if (rawThr > 0) { dotClass = 'dot-warn'; statusText = rawThr + ' threat' + (rawThr > 1 ? 's' : ''); }

        const pills = (c.platforms || []).map(p =>
            p === 'SentinelOne'
                ? '<span class="cc-badge badge-s1">S1</span>'
                : '<span class="cc-badge badge-av">AV</span>'
        ).join('');

        const enc = encodeURIComponent(c.name);
        return `
<div class="cc" onclick="window.location='/client/${enc}'" title="Open ${escHtml(c.name)} dashboard">
  <div class="cc-top">
    <div class="cc-name">${escHtml(c.name)}</div>
    <div class="cc-badges">${pills}</div>
  </div>
  <div class="cc-metrics">
    <div class="cc-metric">
      <div class="cc-metric-val">${eps}</div>
      <div class="cc-metric-lbl">Endpoints</div>
    </div>
    <div class="cc-metric">
      <div class="cc-metric-val">${thr}</div>
      <div class="cc-metric-lbl">Threats</div>
    </div>
    <div class="cc-metric">
      <div class="cc-metric-val">${alr}</div>
      <div class="cc-metric-lbl">Alerts</div>
    </div>
  </div>
  <div class="cc-footer">
    <span class="cc-status"><span class="cc-dot ${dotClass}"></span>${statusText}</span>
    <a class="cc-view" href="/client/${enc}" onclick="event.stopPropagation()">
      View Dashboard
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
</div>`;
    }).join('');
}

function filterCards(q) {
    q = (q || '').toLowerCase().trim();
    const filtered = q ? allClients.filter(c => c.name.toLowerCase().includes(q)) : allClients;
    renderCards(filtered);
}

function toggleSearch() {
    const popup = document.getElementById('search-popup');
    popup.classList.toggle('open');
    if (popup.classList.contains('open')) {
        setTimeout(() => document.getElementById('grid-search')?.focus(), 50);
    }
}

// Close popup on outside click or Escape
document.addEventListener('click', e => {
    const popup = document.getElementById('search-popup');
    const trigger = document.getElementById('search-trigger');
    if (!popup || !trigger) return;
    if (!popup.contains(e.target) && !trigger.contains(e.target)) {
        popup.classList.remove('open');
    }
});
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') document.getElementById('search-popup')?.classList.remove('open');
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        toggleSearch();
    }
});

function connectWS() {
    ws = new WebSocket(WS_URL);
    ws.onmessage = e => {
        try {
            const state = JSON.parse(e.data);
            allClients = (state.clients || []).sort((a,b) => a.name.localeCompare(b.name));
            const q = document.getElementById('grid-search')?.value || '';
            filterCards(q);
        } catch(_) {}
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
    ws.onerror = () => ws.close();
}

function escHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

connectWS();

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('grid-search')?.focus();
    }
});
</script>
</body>
</html>
